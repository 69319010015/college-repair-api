<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="'Sarabun','Noto Sans Thai','TH Sarabun New','Leelawadee UI',sans-serif">
<title>Class Diagram - ระบบแจ้งซ่อม</title>
<rect width="1300" height="900" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="diamond" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 1 6 L 6 1 L 11 6 L 6 11 z" fill="#ffffff" stroke="#475569"/></marker></defs>
<text x="650.0" y="34" font-size="22" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">Class Diagram — โมเดลโดเมนระบบแจ้งซ่อม</text>
<rect x="60" y="90" width="360" height="264" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
<rect x="60" y="90" width="360" height="38" rx="4" fill="#dbe7f7" stroke="#475569" stroke-width="1.4"/>
<text x="240.0" y="115" font-size="16" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">User</text>
<text x="70" y="148" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- id: string</text>
<text x="70" y="169" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- studentId: string</text>
<text x="70" y="190" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- fullName: string</text>
<text x="70" y="211" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- role: Role  «STUDENT|TECHNICIAN|ADMIN»</text>
<text x="70" y="232" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- department: string</text>
<text x="70" y="253" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- createdAt: datetime</text>
<line x1="60" y1="268" x2="420" y2="268" stroke="#475569" stroke-width="1.2"/>
<text x="70" y="282" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ login(studentId): Token</text>
<text x="70" y="303" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ hasRole(role): boolean</text>
<text x="70" y="324" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ canCancelTicket(ticket): boolean</text>
<rect x="60" y="470" width="360" height="243" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
<rect x="60" y="470" width="360" height="38" rx="4" fill="#dbe7f7" stroke="#475569" stroke-width="1.4"/>
<text x="240.0" y="495" font-size="16" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">Device</text>
<text x="70" y="528" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- id: string</text>
<text x="70" y="549" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- assetCode: string  «unique»</text>
<text x="70" y="570" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- name: string</text>
<text x="70" y="591" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- type: DeviceType</text>
<text x="70" y="612" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- location: string</text>
<text x="70" y="633" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- status: ACTIVE | RETIRED</text>
<line x1="60" y1="648" x2="420" y2="648" stroke="#475569" stroke-width="1.2"/>
<text x="70" y="662" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ isAvailable(): boolean</text>
<text x="70" y="683" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ relocate(location): void</text>
<rect x="560" y="200" width="400" height="369" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
<rect x="560" y="200" width="400" height="38" rx="4" fill="#dbe7f7" stroke="#475569" stroke-width="1.4"/>
<text x="760.0" y="225" font-size="16" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">RepairTicket</text>
<text x="570" y="258" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- id: string</text>
<text x="570" y="279" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- ticketNo: string  «RP-2569-0001»</text>
<text x="570" y="300" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- title: string</text>
<text x="570" y="321" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- description: string</text>
<text x="570" y="342" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- category: TicketCategory</text>
<text x="570" y="363" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- priority: LOW|NORMAL|HIGH</text>
<text x="570" y="384" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- status: TicketStatus</text>
<text x="570" y="405" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- requesterId: string  «FK»</text>
<text x="570" y="426" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- deviceId: string  «FK, nullable»</text>
<text x="570" y="447" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- assignedTo: string  «FK, nullable»</text>
<text x="570" y="468" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- createdAt / updatedAt: datetime</text>
<line x1="560" y1="483" x2="960" y2="483" stroke="#475569" stroke-width="1.2"/>
<text x="570" y="497" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ assignTo(technicianId): void</text>
<text x="570" y="518" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ canTransitionTo(next): boolean</text>
<text x="570" y="539" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ updateStatus(next, by, note): StatusLog</text>
<rect x="1040" y="430" width="220" height="222" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
<rect x="1040" y="430" width="220" height="38" rx="4" fill="#dbe7f7" stroke="#475569" stroke-width="1.4"/>
<text x="1150.0" y="455" font-size="16" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">StatusLog</text>
<text x="1050" y="488" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- id: string</text>
<text x="1050" y="509" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- ticketId: string  «FK»</text>
<text x="1050" y="530" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- status: TicketStatus</text>
<text x="1050" y="551" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- byUserId: string  «FK»</text>
<text x="1050" y="572" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- note: string</text>
<text x="1050" y="593" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">- at: datetime</text>
<line x1="1040" y1="608" x2="1260" y2="608" stroke="#475569" stroke-width="1.2"/>
<text x="1050" y="622" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ isTerminal(): boolean</text>
<rect x="1040" y="90" width="220" height="180" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
<rect x="1040" y="90" width="220" height="38" rx="4" fill="#dbe7f7" stroke="#475569" stroke-width="1.4"/>
<text x="1150.0" y="115" font-size="16" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">«enumeration»</text>
<text x="1050" y="148" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">TicketStatus</text>
<text x="1050" y="169" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">PENDING, ACCEPTED,</text>
<text x="1050" y="190" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">IN_PROGRESS, COMPLETED,</text>
<text x="1050" y="211" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal" font-style="normal">CLOSED, REJECTED, CANCELED</text>
<line x1="1040" y1="226" x2="1260" y2="226" stroke="#475569" stroke-width="1.2"/>
<text x="1050" y="240" font-size="13" text-anchor="start" fill="#334155" font-weight="normal" font-style="normal">+ canTransition(from,to)</text>
<line x1="420" y1="150" x2="560" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#diamond)"/>
<text x="480" y="190" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="normal" font-style="normal">1  แจ้ง  0..*</text>
<line x1="420" y1="530" x2="560" y2="420" stroke="#475569" stroke-width="1.6" marker-end="url(#diamond)"/>
<text x="510" y="500" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="normal" font-style="normal">1  ถูกแจ้ง  0..*</text>
<line x1="960" y1="470" x2="1040" y2="520" stroke="#475569" stroke-width="1.6" marker-end="url(#diamond)"/>
<text x="1000" y="512" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="normal" font-style="normal">1  มีประวัติ  0..*</text>
<line x1="960" y1="260" x2="1040" y2="260" stroke="#475569" stroke-width="1.4" marker-end="url(#arrowOpen)" stroke-dasharray="5 4"/>
<text x="1000.0" y="250" font-size="12" text-anchor="middle" fill="#334155" font-weight="normal" font-style="normal">«use»</text>
<text x="650.0" y="876" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">หมายเหตุ: User 1 คนเป็นได้ทั้งผู้แจ้ง (requesterId) และผู้รับงาน (assignedTo) ของ RepairTicket หลายใบ</text>
</svg>