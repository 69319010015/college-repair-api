<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1090" viewBox="0 0 1450 1090" font-family="'Sarabun','Noto Sans Thai','Garuda',sans-serif">
<title>Use Case Diagram - ระบบแจ้งซ่อมคอมพิวเตอร์และอุปกรณ์ของวิทยาลัย</title>
<rect width="1450" height="1090" fill="#ffffff"/>
<text x="725.0" y="42" font-size="22" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">Use Case Diagram — ระบบแจ้งซ่อมคอมพิวเตอร์และอุปกรณ์ของวิทยาลัย</text>
<rect x="300" y="80" width="900" height="960" rx="10" fill="#f8fafc" stroke="#1f3864" stroke-width="2.2"/>
<text x="750.0" y="110" font-size="15.5" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">ระบบแจ้งซ่อมคอมพิวเตอร์และอุปกรณ์ของวิทยาลัย</text>
<ellipse cx="725" cy="190" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="725" y="195" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">เข้าสู่ระบบ</text>
<ellipse cx="480" cy="330" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="480" y="326" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="480" y="344" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">แจ้งซ่อมคอมพิวเตอร์</text>
<ellipse cx="480" cy="450" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="480" y="446" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="480" y="464" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">ติดตามสถานะงานซ่อม</text>
<ellipse cx="480" cy="570" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="480" y="575" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">ยกเลิกคำขอซ่อม</text>
<ellipse cx="480" cy="700" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="480" y="696" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="480" y="714" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">ดูประวัติการซ่อมของเครื่อง</text>
<ellipse cx="930" cy="330" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="930" y="335" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">รับงานซ่อม</text>
<ellipse cx="930" cy="450" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="930" y="446" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="930" y="464" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">อัปเดตสถานะและบันทึกผลซ่อม</text>
<ellipse cx="930" cy="570" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="930" y="566" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="930" y="584" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">บันทึกประวัติการซ่อม</text>
<ellipse cx="930" cy="700" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="930" y="696" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="930" y="714" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">ดูรายงานสรุปงานซ่อม</text>
<ellipse cx="930" cy="830" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="930" y="826" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="930" y="844" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">มอบหมายงานให้ช่าง</text>
<ellipse cx="930" cy="950" rx="105" ry="44" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
<text x="930" y="946" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal"></text>
<text x="930" y="964" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="normal">จัดการทะเบียนเครื่องและห้อง</text>
<circle cx="200" cy="400" r="12" fill="none" stroke="#1d4ed8" stroke-width="2"/>
