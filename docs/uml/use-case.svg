<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="'Sarabun','Noto Sans Thai','TH Sarabun New','Leelawadee UI',sans-serif">
<title>Use Case Diagram - ระบบแจ้งซ่อมคอมพิวเตอร์และอุปกรณ์ของวิทยาลัย</title>
<rect width="1240" height="860" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="diamond" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 1 6 L 6 1 L 11 6 L 6 11 z" fill="#ffffff" stroke="#475569"/></marker></defs>
<text x="620.0" y="34" font-size="22" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">Use Case Diagram — ระบบแจ้งซ่อมคอมพิวเตอร์และอุปกรณ์ของวิทยาลัย</text>
<rect x="330" y="60" width="620" height="770" rx="10" fill="#f8fafc" stroke="#1f3864" stroke-width="2.2"/>
<text x="640.0" y="90" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ระบบแจ้งซ่อมคอมพิวเตอร์และอุปกรณ์ของวิทยาลัย</text>
<ellipse cx="470" cy="130" rx="125" ry="46" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.6"/>
