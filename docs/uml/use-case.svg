<text x="300" y="1078" font-size="12.5" text-anchor="start" fill="#475569" font-weight="normal" font-style="italic">«include» = ทุกครั้งที่ทำ use case ต้นทาง ระบบต้องทำงานของ use case ปลายทางรวมอยู่ด้วยเสมอ</text>
