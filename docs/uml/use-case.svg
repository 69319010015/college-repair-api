<text x="1290" y="890" font-size="13.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold" font-style="normal">หัวหน้างานอาคารสถานที่</text>
<text x="1290" y="909" font-size="13.5" text-anchor="middle" fill="#1d4ed8" font-weight="bold" font-style="normal">และคอมพิวเตอร์</text>
