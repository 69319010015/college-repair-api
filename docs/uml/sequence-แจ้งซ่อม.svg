<line x1="660" y1="390" x2="400" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="530.0" y="382" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">ticket</text>
<rect x="394" y="394" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
<line x1="400" y1="450" x2="120" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="260.0" y="442" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">201 Created  {ticketNo, status: PENDING}</text>
<rect x="114" y="454" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
<line x1="1150" y1="540" x2="400" y2="540" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="775.0" y="532" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">PATCH /tickets/:id/status  {ACCEPTED}</text>
<rect x="394" y="544" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
<line x1="400" y1="600" x2="660" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530.0" y="592" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">updateStatus(id, ACCEPTED, user)</text>
<rect x="654" y="604" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
<path d="M 660 660 h 90 v 46 h -90" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="720" y="760" font-size="12.5" text-anchor="middle" fill="#334155" font-weight="normal" font-style="normal">ตรวจ state machine + บทบาทผู้ใช้</text>
<line x1="660" y1="740" x2="900" y2="740" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780.0" y="732" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">save(ticket)  assignedTo=techId</text>
<rect x="894" y="744" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
<line x1="900" y1="800" x2="660" y2="800" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="780.0" y="792" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">ticket {status: ACCEPTED}</text>
<rect x="654" y="804" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
<line x1="660" y1="860" x2="1150" y2="860" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="905.0" y="852" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">200 OK  {status: ACCEPTED, assignedTo}</text>
<rect x="1144" y="864" width="12" height="34" rx="2" fill="#c7d7f5" stroke="#3b6fd4" stroke-width="1"/>
</svg>