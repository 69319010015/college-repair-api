<rect x="565" y="70" width="190" height="44" rx="4" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/>
<text x="660" y="98" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">TicketService</text>
<line x1="660" y1="114" x2="660" y2="880" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 6"/>
<rect x="805" y="70" width="190" height="44" rx="4" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/>
<text x="900" y="98" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">TicketRepository</text>
<line x1="900" y1="114" x2="900" y2="880" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 6"/>
<rect x="1055" y="70" width="190" height="44" rx="4" fill="#eef2ff" stroke="#3b6fd4" stroke-width="1.4"/>
<text x="1150" y="98" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ช่างเทคนิค</text>
<line x1="1150" y1="114" x2="1150" y2="880" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 6"/>
<line x1="120" y1="150" x2="400" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="260.0" y="142" font-size="12.5" text-anchor="middle" fill="#222" font-weight="normal" font-style="normal">POST /api/v1/tickets  {title, description, category}</text>
