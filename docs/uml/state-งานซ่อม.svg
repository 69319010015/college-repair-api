<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="'Sarabun','Noto Sans Thai','TH Sarabun New','Leelawadee UI',sans-serif">
<title>Activity Diagram - ขั้นตอนงานซ่อม</title>
<rect width="1180" height="860" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="arrowOpen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#475569" stroke-width="1.4"/></marker><marker id="diamond" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 1 6 L 6 1 L 11 6 L 6 11 z" fill="#ffffff" stroke="#475569"/></marker></defs>
<text x="590.0" y="32" font-size="21" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">State / Activity Diagram — วงจรชีวิตของงานซ่อม (Ticket Status)</text>
<rect x="495.0" y="120" width="190" height="70" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="590.0" y="150" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">รอรับเรื่อง</text>
<text x="590.0" y="172" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">PENDING</text>
<rect x="495.0" y="300" width="190" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="590.0" y="330" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ช่างรับเรื่อง</text>
<text x="590.0" y="352" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">ACCEPTED</text>
<rect x="495.0" y="480" width="190" height="70" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="590.0" y="510" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">กำลังซ่อม</text>
<text x="590.0" y="532" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">IN_PROGRESS</text>
<rect x="495.0" y="660" width="190" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="590.0" y="690" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ซ่อมเสร็จ</text>
<text x="590.0" y="712" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">COMPLETED</text>
<rect x="495.0" y="780" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<text x="590.0" y="810" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ปิดงาน</text>
<text x="590.0" y="832" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">CLOSED</text>
<line x1="590.0" y1="190" x2="590.0" y2="300" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="370" x2="590.0" y2="480" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="550" x2="590.0" y2="660" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="730" x2="590.0" y2="780" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120" y="300" width="170" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="205" y="328" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ถูกปฏิเสธ</text>
<text x="205" y="348" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">REJECTED</text>
<line x1="495.0" y1="335" x2="290" y2="332" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360" y="320" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="normal" font-style="normal">ไม่รับ / อุปกรณ์ซ่อมไม่ได้</text>
<rect x="900" y="340" width="170" height="64" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="985" y="368" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ยกเลิกโดยผู้แจ้ง</text>
<text x="985" y="388" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">CANCELED</text>
<line x1="685.0" y1="340" x2="900" y2="372" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="760" y="330" font-size="12" text-anchor="start" fill="#4b5563" font-weight="normal" font-style="normal">ก่อนช่างรับเรื่องเท่านั้น</text>
<text x="590.0" y="830" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">ทุกการเปลี่ยนสถานะถูกบันทึกลง ticket_status_logs (ใครเปลี่ยน เมื่อไร จากอะไรเป็นอะไร)</text>
</svg>