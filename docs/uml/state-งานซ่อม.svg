<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="920" viewBox="0 0 1180 920" font-family="'Sarabun','Noto Sans Thai','Garuda',sans-serif">
<title>State Diagram - วงจรสถานะงานซ่อม</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1180" height="920" fill="#ffffff"/>
<text x="590.0" y="42" font-size="22" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">State Diagram — วงจรชีวิตของงานซ่อม (Ticket Status)</text>
<rect x="370.0" y="100" width="200" height="72" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="470" y="130" font-size="15.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">รอดำเนินการ</text>
<text x="470" y="152" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">PENDING</text>
<rect x="370.0" y="270" width="200" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="470" y="300" font-size="15.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ช่างรับเรื่องแล้ว</text>
<text x="470" y="322" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">ACCEPTED</text>
<rect x="370.0" y="440" width="200" height="72" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="470" y="470" font-size="15.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">กำลังซ่อม</text>
<text x="470" y="492" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">IN_PROGRESS</text>
<rect x="370.0" y="610" width="200" height="72" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="470" y="640" font-size="15.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ซ่อมเสร็จ</text>
<text x="470" y="662" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">COMPLETED</text>
<rect x="370.0" y="760" width="200" height="72" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
<text x="470" y="790" font-size="15.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ปิดงาน</text>
<text x="470" y="812" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">CLOSED</text>
<path d="M 470 172 L 470 268" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 470 342 L 470 438" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 470 512 L 470 608" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 470 682 L 470 758" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="800" y="440" width="200" height="72" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="900.0" y="470" font-size="15.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">รออะไหล่</text>
<text x="900.0" y="492" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">WAITING_PARTS</text>
<path d="M 570.0 466 L 798 466" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="685.0" y="458" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="normal" font-style="normal">อะไหล่หมด</text>
<path d="M 800 492 L 572.0 492" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="685.0" y="508" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="normal" font-style="normal">อะไหล่มาแล้ว</text>
<path d="M 900.0 512 L 900.0 646 L 572.0 646" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="908.0" y="620" font-size="11.5" text-anchor="start" fill="#c2410c" font-weight="normal" font-style="normal">ซ่อมเสร็จจากรออะไหล่</text>
<rect x="90" y="270" width="180" height="66" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="180" y="298" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ซ่อมไม่ได้</text>
<text x="180" y="318" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">REJECTED</text>
<path d="M 370.0 136 L 180 268" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300" y="200" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="normal" font-style="normal">ไม่รับงาน / ซ่อมไม่ได้</text>
<rect x="900" y="160" width="190" height="66" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="995" y="188" font-size="14.5" text-anchor="middle" fill="#1f2937" font-weight="bold" font-style="normal">ผู้แจ้งยกเลิก</text>
<text x="995" y="208" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" font-style="normal">CANCELED</text>
<path d="M 570.0 136 L 995 158" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760" y="140" font-size="12" text-anchor="start" fill="#4b5563" font-weight="normal" font-style="normal">ก่อนช่างรับเรื่องเท่านั้น</text>
<text x="590.0" y="880" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">ทุกการเปลี่ยนสถานะถูกบันทึกเป็นประวัติ (ใครเปลี่ยน เมื่อไร จากสถานะใดเป็นสถานะใด)</text>
<text x="590.0" y="902" font-size="13" text-anchor="middle" fill="#1f3864" font-weight="bold" font-style="normal">4 สถานะหลักตามโจทย์: รอดำเนินการ · กำลังซ่อม · รออะไหล่ · ซ่อมเสร็จ</text>
</svg>